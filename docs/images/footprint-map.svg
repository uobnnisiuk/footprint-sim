<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="sans-serif">
  <defs>
    <radialGradient id="heat" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e2543e" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#f08c2e" stop-opacity="0.65"/>
      <stop offset="65%" stop-color="#f5d13d" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#f5d13d" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <rect width="640" height="400" fill="#e8f0e4"/>
  <path d="M0,300 C120,270 180,330 320,300 C460,270 540,320 640,290 L640,400 L0,400 Z" fill="#cfe3c0"/>
  <path d="M0,80 C150,60 260,110 400,85 C500,68 580,95 640,80 L640,0 L0,0 Z" fill="#dcebd2"/>
  <path d="M120,0 C160,90 90,160 150,240 C190,295 170,350 190,400" stroke="#8fc1e3" stroke-width="16" fill="none" opacity="0.8"/>
  <path d="M0,210 C160,190 300,225 640,180" stroke="#d8cf9f" stroke-width="7" fill="none"/>
  <path d="M330,400 C340,300 315,220 345,120 C360,70 350,30 355,0" stroke="#d8cf9f" stroke-width="6" fill="none"/>
  <g font-size="13" fill="#5a6b52" font-weight="600">
    <text x="40" y="130">北の尾根</text><text x="470" y="130">東の集落</text>
    <text x="52" y="360">南の河原</text><text x="480" y="350">南東の森</text>
    <text x="255" y="45">高原</text><text x="238" y="382">橋のたもと</text>
  </g>
  <text x="100" y="200" font-size="11" fill="#4a7ba6">川</text>
  <!-- heat layer: broad faint wash that fades as evidence concentrates the heat -->
  <g filter="url(#soft)">
    <ellipse cx="320" cy="200" rx="330" ry="200" fill="url(#heat)" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.5;0.28;0.12;0;0" keyTimes="0;0.15;0.35;0.55;0.75;1" dur="12s" repeatCount="indefinite"/>
    </ellipse>
    <!-- main heat blob: drifts east and concentrates -->
    <ellipse cx="320" cy="200" rx="240" ry="150" fill="url(#heat)">
      <animate attributeName="cx" values="320;320;400;480;532;532" keyTimes="0;0.15;0.35;0.55;0.75;1" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="200;200;215;225;217;217" keyTimes="0;0.15;0.35;0.55;0.75;1" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="rx" values="240;240;165;105;58;58" keyTimes="0;0.15;0.35;0.55;0.75;1" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="150;150;110;70;40;40" keyTimes="0;0.15;0.35;0.55;0.75;1" dur="12s" repeatCount="indefinite"/>
    </ellipse>
    <!-- secondary warm blob near encounter, appears mid-way then merges away -->
    <ellipse cx="455" cy="240" rx="90" ry="55" fill="url(#heat)" opacity="0">
      <animate attributeName="opacity" values="0;0;0.75;0.4;0;0" keyTimes="0;0.32;0.42;0.6;0.75;1" dur="12s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  <!-- truth trail (answer key, not used by inference) -->
  <path d="M355,388 C350,320 380,285 420,262 C462,238 505,232 545,205" stroke="#7a3ea1" stroke-width="3" fill="none" stroke-dasharray="2 6"/>
  <circle cx="545" cy="205" r="8" fill="#7a3ea1"/>
  <text x="462" y="188" font-size="12" fill="#7a3ea1" font-weight="700">★ 実際の足取りの先</text>
  <!-- evidence markers appear in sequence -->
  <g opacity="0">
    <circle cx="392" cy="278" r="8" fill="#1f7a4d"/><text x="360" y="306" font-size="11" fill="#1f7a4d" font-weight="700">証拠1 本人の観測</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3;0.38;1" dur="12s" repeatCount="indefinite"/>
  </g>
  <g opacity="0">
    <circle cx="470" cy="245" r="8" fill="#b8860b"/><text x="428" y="230" font-size="11" fill="#8a6508" font-weight="700">証拠2 すれ違い（横糸）</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5;0.58;1" dur="12s" repeatCount="indefinite"/>
  </g>
  <g opacity="0">
    <circle cx="520" cy="218" r="8" fill="#205a9e"/><text x="452" y="266" font-size="11" fill="#205a9e" font-weight="700">証拠3 追加証拠を受領</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.68;0.76;1" dur="12s" repeatCount="indefinite"/>
  </g>
  <g><rect x="28" y="196" width="18" height="14" fill="#444"/><text x="20" y="228" font-size="11" fill="#333" font-weight="700">救助拠点</text></g>
  <text x="320" y="392" font-size="12" fill="#555" text-anchor="middle">候補の濃さは説明用で、確率・順位・実測値ではない（模式図）</text>
</svg>
