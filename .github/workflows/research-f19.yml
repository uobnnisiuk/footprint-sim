name: Footprint F19 research evidence

on:
  pull_request:
    paths:
      - '.github/workflows/research-f19.yml'
      - '.github/scripts/run_f19_research_validation.py'
      - '.github/scripts/test_candidate_density_verifier.py'
      - '.github/scripts/test_research_validation.py'
      - 'scripts/verify-candidate-density.py'
      - 'src/**'
      - 'tests/**'
      - 'experiments/m1f1[6789]*/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/research-f19.yml'
      - '.github/scripts/run_f19_research_validation.py'
      - '.github/scripts/test_candidate_density_verifier.py'
      - '.github/scripts/test_research_validation.py'
      - 'scripts/verify-candidate-density.py'
      - 'src/**'
      - 'tests/**'
      - 'experiments/m1f1[6789]*/**'
  # No user-supplied command, seed, protocol, model, or credential inputs.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-f19-${{ github.ref }}
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact research revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: current
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the frozen F18 research baseline separately
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 77611bc52976178857ac442be6e07a9caa1a2a9d
          path: baseline
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: current/global.json
      - name: Run fixed research commands without credential environment variables
        working-directory: current
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/f19-home" "$RUNNER_TEMP/footprint-f19-evidence"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/f19-home" \
            DOTNET_ROOT="$DOTNET_ROOT" DOTNET_CLI_HOME="$RUNNER_TEMP/f19-home" \
            DOTNET_CLI_TELEMETRY_OPTOUT=1 DOTNET_SKIP_FIRST_TIME_EXPERIENCE=1 \
            DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE=1 DOTNET_NOLOGO=1 \
            LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 \
            python3 -B .github/scripts/run_f19_research_validation.py \
              --baseline-source "$GITHUB_WORKSPACE/baseline" \
              --expected-source-sha "$EXPECTED_SOURCE_SHA" \
              --output "$RUNNER_TEMP/footprint-f19-evidence"
      - name: Reject symlinks and special files before any artifact upload
        if: always()
        id: artifact_tree
        shell: bash
        run: |
          env -i PATH="$PATH" python3 - "$RUNNER_TEMP/footprint-f19-evidence" <<'PY'
          import os
          from pathlib import Path
          import stat
          import sys
          root = Path(sys.argv[1])
          if root.is_symlink() or not root.is_dir():
              raise SystemExit('Artifact root is not an ordinary directory')
          for parent, directories, files in os.walk(root, followlinks=False):
              for name in directories + files:
                  mode = (Path(parent) / name).lstat().st_mode
                  if not (stat.S_ISDIR(mode) or stat.S_ISREG(mode)):
                      raise SystemExit('Artifact tree contains a link or special entry')
          PY
      - name: Retain full research results and failure evidence
        if: always() && steps.artifact_tree.outcome == 'success'
        id: artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: footprint-f19-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/footprint-f19-evidence/
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
          include-hidden-files: false
      - name: Link the immutable artifact in the run summary
        if: always() && steps.artifact.outcome == 'success'
        shell: bash
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
        run: |
          printf 'Research evidence: %s\n\nArtifact SHA256: `%s`\n\nRead evidence.json for completion status; failed runs may contain partial outputs.\n' \
            "$ARTIFACT_URL" "$ARTIFACT_DIGEST" >> "$GITHUB_STEP_SUMMARY"
